<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嶼地特寵醫院｜盤點系統</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<section id="login"><div class="login-box"><div class="brand-mark">嶼</div><h1>嶼地特寵醫院</h1><p>庫存盤點系統</p><form id="login-form"><label>登入密碼<input type="password" name="password" autocomplete="current-password" required></label><button>登入系統</button><p class="error" id="login-error" role="alert"></p></form></div></section>
<div id="shell" hidden><aside><div class="brand"><span class="brand-mark">嶼</span><div>嶼地特寵醫院<small>庫存盤點系統</small></div></div><nav><button data-page="overview">總覽</button><button data-page="products">商品管理</button><button data-page="counts">盤點管理</button><button data-page="forecast">預估耗用量</button></nav><div class="aside-foot">讓每一次盤點<br>成為採購的依據。</div></aside><main><header><div><span class="eyebrow">INVENTORY / 嶼地</span><h1 id="page-title">總覽</h1></div><div class="header-actions"><span id="today"></span><button class="secondary" id="export">匯出盤點 CSV</button><button class="text-button" id="logout">登出</button></div></header><p id="message" role="status"></p><div id="content"></div></main></div>
<dialog id="product-dialog"><form id="product-form"><div class="dialog-head"><h2 id="dialog-title">新增商品</h2><button type="button" class="text-button" id="close-dialog">關閉</button></div><input name="id" type="hidden"><div class="form-grid"><label>品名 *<input name="name" required maxlength="1000"></label><label>盤點單位 *<input name="unit" required placeholder="例如：支、瓶、個" maxlength="1000"></label><label>國際條碼<input name="barcode" maxlength="1000"></label><label>分類<input name="category" placeholder="例如：醫療耗材" maxlength="1000"></label><label>存放位置<input name="location" maxlength="1000"></label><label>狀態<select name="active"><option value="1">啟用</option><option value="0">停用</option></select></label></div><label>備註<textarea name="note" maxlength="1000"></textarea></label><p>單位請保持一致，已有盤點紀錄的商品請勿更換單位。</p><p id="product-error" class="error" role="alert"></p><button>儲存商品</button></form></dialog>
</body></html>
