name: Publish app image
on:
  workflow_run:
    workflows: [Inventory checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-islevetah-app
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified app image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cp296944/islevetah-app:latest
            ghcr.io/cp296944/islevetah-app:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha }}
      - name: Record published version
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published app revision: %s\nImage digest: %s\nService to update: app (islevetah-app)\n' "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
