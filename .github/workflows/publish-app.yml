name: Publish affected images
on:
  push:
    branches: [main]
    paths:
      - server.py
      - public/**
      - Dockerfile
      - .dockerignore
      - ota/**
      - .github/workflows/publish-app.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-islevetah
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install docker==7.1.0
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - name: Determine affected services
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > /tmp/changed-files
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed-files
          fi
          if grep -Eq '^(server.py|public/|Dockerfile|.dockerignore|.github/workflows/publish-app.yml)' /tmp/changed-files; then echo 'app=true' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^(ota/|.github/workflows/publish-app.yml)' /tmp/changed-files; then echo 'ota=true' >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish app
        if: steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cp296944/islevetah-app:latest
            ghcr.io/cp296944/islevetah-app:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
      - name: Publish updater for independent deployment
        if: steps.changed.outputs.ota == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ota
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cp296944/islevetah-ota:latest
            ghcr.io/cp296944/islevetah-ota:sha-${{ github.sha }}
