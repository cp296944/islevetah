<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嶼地特寵醫院｜盤點系統</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<section id="login"><div class="login-box"><div class="brand-mark">嶼</div><h1>嶼地特寵醫院</h1><p>庫存盤點系統</p><form id="login-form"><label>帳號<input name="username" autocomplete="username" required maxlength="64"></label><label>登入密碼<div class="password-row"><input type="password" name="password" autocomplete="current-password" required maxlength="256"><button type="button" class="secondary toggle-password">顯示</button></div></label><label class="check-label"><input type="checkbox" name="remember">保持登入 30 天</label><button>登入系統</button><p class="error" id="login-error" role="alert"></p></form><button id="show-register" class="text-button">申請帳號</button><form id="register-form" hidden><h2>申請帳號</h2><p>管理員核准並配置權限後才能登入。</p><label>帳號<input name="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,64}" required maxlength="64" placeholder="3–64 個英數字或 _ . -"></label><label>姓名<input name="full_name" required maxlength="100" autocomplete="name"></label><label>Email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>手機<input name="phone" type="tel" required maxlength="30" autocomplete="tel"></label><label>密碼（6 至 256 個字元）<div class="password-row"><input type="password" name="password" required minlength="6" maxlength="256" autocomplete="new-password"><button type="button" class="secondary toggle-password">顯示</button></div></label><label>再次輸入密碼<div class="password-row"><input type="password" name="confirm_password" required minlength="6" maxlength="256" autocomplete="new-password"><button type="button" class="secondary toggle-password">顯示</button></div></label><button>送出申請</button><p id="register-message" role="status"></p><button type="button" id="back-login" class="text-button">返回登入</button></form></div></section>
<div id="shell" hidden><aside><div class="brand"><span class="brand-mark">嶼</span><div>嶼地特寵醫院<small>庫存盤點系統</small></div></div><nav><button data-page="overview">總覽</button><button data-page="products">商品管理</button><button data-page="counts">盤點管理</button><button data-page="forecast">預估耗用量</button><button data-page="accounts" hidden>帳戶管理</button><button data-page="ota" hidden>系統維護</button><button data-page="password">修改密碼</button></nav><div class="aside-foot">讓每一次盤點<br>成為採購的依據。</div></aside><main><header><div><span class="eyebrow">INVENTORY / 嶼地</span><h1 id="page-title">總覽</h1></div><div class="header-actions"><span id="current-user"></span><span id="today"></span><button class="secondary" id="export">匯出盤點 CSV</button><button class="text-button" id="logout">登出</button></div></header><p id="message" role="status"></p><div id="content"></div></main></div>
<dialog id="product-dialog"><form id="product-form"><div class="dialog-head"><h2 id="dialog-title">新增商品</h2><button type="button" class="text-button" id="close-dialog">關閉</button></div><input name="id" type="hidden"><div class="form-grid"><label>品名 *<input name="name" required maxlength="1000"></label><label>盤點單位 *<select name="unit" required></select><input name="new_unit" aria-label="新增盤點單位" placeholder="輸入新單位，例如：支、瓶、個" maxlength="1000" hidden disabled></label><label>國際條碼<input name="barcode" maxlength="1000"></label><label>分類<select name="category"></select><input name="new_category" aria-label="新增分類" placeholder="輸入新分類，例如：醫療耗材" maxlength="1000" hidden disabled></label><label>存放位置<input name="location" maxlength="1000"></label><label>狀態<select name="active"><option value="1">啟用</option><option value="0">停用</option></select></label></div><label>備註<textarea name="note" maxlength="1000"></textarea></label><p>單位請保持一致，已有盤點紀錄的商品請勿更換單位。</p><p id="product-error" class="error" role="alert"></p><div class="product-actions"><button id="save-product">儲存商品</button><button type="button" id="delete-product" class="secondary delete-button" hidden>刪除商品</button></div></form></dialog>
<dialog id="delete-confirm-dialog" aria-labelledby="delete-confirm-title"><h2 id="delete-confirm-title">刪除商品</h2><p id="delete-confirm-message"></p><div class="product-actions"><button type="button" id="cancel-product-delete" class="secondary">取消</button><button type="button" id="confirm-product-delete" class="secondary delete-button">確認刪除</button></div></dialog><dialog id="option-manager" aria-labelledby="option-manager-title"><div class="dialog-head"><h2 id="option-manager-title">管理分類／單位</h2><button type="button" id="close-option-manager" class="text-button">關閉 ×</button></div><p>整理共用選項，修正錯字或合併重複分類。商品資料會一起更新。</p><div class="option-tabs" role="tablist" aria-label="選項類型"><button type="button" role="tab" id="category-tab" data-option-kind="category">分類</button><button type="button" role="tab" id="unit-tab" data-option-kind="unit">盤點單位</button></div><div id="option-manager-content"></div><p id="option-manager-error" class="error" role="alert"></p><div class="option-manager-foot"><span>此功能僅供管理員使用</span><button type="button" id="finish-option-manager" class="secondary">完成</button></div></dialog>
<dialog id="option-action-dialog" aria-labelledby="option-action-title"><form id="option-action-form"><div class="dialog-head"><h2 id="option-action-title"></h2><button type="button" id="close-option-action" class="text-button">取消</button></div><p id="option-action-detail"></p><label id="option-name-label">名稱<input name="option_name" maxlength="1000" required></label><label id="option-target-label">合併至<select name="option_target" required></select></label><p id="option-action-warning"></p><p id="option-action-error" class="error" role="alert"></p><div class="product-actions"><button id="save-option-action">儲存</button><button type="button" id="cancel-option-action" class="secondary">取消</button></div></form></dialog>
<dialog id="account-dialog"><form id="account-form"><div class="dialog-head"><h2 id="account-title">新增帳號</h2><button type="button" class="text-button" id="close-account">關閉</button></div><input name="id" type="hidden"><div class="form-grid"><label>帳號<input name="username" required pattern="[A-Za-z0-9_.-]{3,64}" maxlength="64"></label><label>姓名<input name="full_name" required maxlength="100"></label><label>Email<input name="email" type="email" required maxlength="254"></label><label>手機<input name="phone" type="tel" required maxlength="30"></label></div><label id="initial-password">初始密碼（6 至 256 個字元）<div class="password-row"><input name="password" type="password" minlength="6" maxlength="256" autocomplete="new-password"><button type="button" class="secondary toggle-password">顯示</button></div></label><p id="account-info"></p><fieldset><legend>角色與狀態</legend><label class="check-label"><input type="checkbox" name="admin">管理員（全部權限）</label><label class="check-label"><input type="checkbox" name="active" checked>啟用帳號</label></fieldset><fieldset><legend>系統權限</legend><label class="check-label"><input type="checkbox" name="permission" value="inventory.view">查詢庫存與耗用量</label><label class="check-label"><input type="checkbox" name="permission" value="counts.manage">登記盤點</label><label class="check-label"><input type="checkbox" name="permission" value="products.manage">管理商品</label></fieldset><p id="account-error" class="error" role="alert"></p><div class="account-actions"><button id="save-profile" name="action" value="profile">儲存帳號資料</button><button id="save-account" name="action" value="save">儲存角色與權限</button><button id="approve-account" formnovalidate name="action" value="approve">核准申請</button><button id="reject-account" formnovalidate name="action" value="reject" class="secondary">不核准</button></div></form><form id="reset-form"><h3>重設密碼</h3><label>新暫時密碼<div class="password-row"><input name="password" type="password" minlength="6" maxlength="256" required autocomplete="new-password"><button type="button" class="secondary toggle-password">顯示</button></div></label><button class="secondary">重設並撤銷登入</button><p>使用者下次登入須修改暫時密碼。</p><p id="reset-error" class="error" role="alert"></p></form></dialog>
</body></html>
